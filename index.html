<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#211f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Gym Log</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="timer" class="timer" hidden aria-live="polite"></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today">Today</button>
    <button type="button" data-tab="history">History</button>
    <button type="button" data-tab="program">Program</button>
    <button type="button" data-tab="data">Backup</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
